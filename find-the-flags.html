const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let region='all', rounds=10, deck=[], current=null, round=0, score=0, answered=false, selected=null, selectedButton=null;
try{const d=JSON.parse(localStorage.getItem('retroGamesDLemonis')||'{}');if(Array.isArray(d.players)){$('#p1').textContent=d.players[0]||'Παίκτης 1';$('#p2').textContent=d.players[1]||'Παίκτης 2'}}catch(e){}
function selectGroup(container,cb){$$(container+' .choice').forEach(b=>b.onclick=()=>{$$(container+' .choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');cb(b.dataset.value)})}
selectGroup('#regionChoices',v=>region=v);selectGroup('#roundChoices',v=>rounds=Number(v));
function pool(){return FLAGS.filter(f=>region==='all'||f.region===region)}
function setFlag(f){const col=f.index%15,row=Math.floor(f.index/15);$('#flag').style.backgroundPosition=`-${col*240}px -${row*150}px`}
function start(){const p=pool();if(p.length<4)return alert('Δεν υπάρχουν αρκετές σημαίες');deck=shuffle(p);round=0;score=0;$('#total').textContent=rounds;$('#score').textContent=0;$('#setup').classList.add('hidden');$('#results').classList.add('hidden');$('#game').classList.remove('hidden');nextQuestion()}
function nextQuestion(){if(round>=rounds||!deck.length)return finish();current=deck.shift();round++;answered=false;selected=null;selectedButton=null;$('#round').textContent=round;$('#message').textContent='';$('#next').classList.add('hidden');$('#confirm').classList.remove('hidden');$('#confirm').disabled=true;setFlag(current);const p=pool();const wrong=shuffle(p.filter(x=>x.code!==current.code)).slice(0,3);const options=shuffle([current,...wrong]);const box=$('#answers');box.innerHTML='';options.forEach(opt=>{const b=document.createElement('button');b.className='answer';b.textContent=opt.name;b.onclick=()=>selectAnswer(opt,b);box.appendChild(b)})}
function selectAnswer(opt,btn){if(answered)return;selected=opt;selectedButton=btn;$$('#answers .answer').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');$('#confirm').disabled=false}
function confirmAnswer(){if(answered||!selected||!selectedButton)return;answered=true;const ok=selected.code===current.code;$$('#answers .answer').forEach(b=>{b.disabled=true;b.classList.remove('selected');if(b.textContent===current.name)b.classList.add('correct')});if(!ok)selectedButton.classList.add('wrong');if(ok){score++;$('#score').textContent=score;$('#message').textContent='Σωστά!'}else $('#message').textContent='Λάθος. Η σωστή απάντηση είναι: '+current.name;$('#confirm').classList.add('hidden');$('#next').classList.remove('hidden')}
function finish(){$('#game').classList.add('hidden');$('#results').classList.remove('hidden');$('#finalScore').textContent=score+' / '+rounds}
$('#start').onclick=start;$('#confirm').onclick=confirmAnswer;$('#next').onclick=nextQuestion;$('#again').onclick=()=>{$('#results').classList.add('hidden');$('#setup').classList.remove('hidden')};
